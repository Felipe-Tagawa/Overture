title = "Documentação do Dataset de Asteroides (JPL/NASA)"
version = "1.0.0"
description = "Parâmetros orbitais e físicos de asteroides e corpos menores do Sistema Solar."

[columns.id]
type = "string"
description = "ID interno do registro no banco de dados."
example = "a0000001"

[columns.spkid]
type = "string"
description = "ID do corpo primário do banco de dados JPL (SPK-ID)."
example = "2000001"

[columns.full_name]
type = "string"
description = "Nome completo do asteroide, incluindo número e designação."
example = "1 Ceres"

[columns.pdes]
type = "string"
description = "Designação primária do asteroide."
example = "1"

[columns.name]
type = "string"
description = "Nome próprio do asteroide (se houver)."
example = "Ceres"

[columns.prefix]
type = "string"
description = "Prefixo provisório ou de classificação da órbita."
example = "A"

[columns.neo]
type = "boolean"
description = "Indicador de Objeto Próximo à Terra (Near-Earth Object). Y (Sim) ou N (Não)."
example = "N"

[columns.pha]
type = "boolean"
description = "Indicador de Asteroide Potencialmente Perigoso (Potentially Hazardous Asteroide). Y ou N."
example = "N"

[columns.H]
type = "float"
description = "Magnitude absoluta do asteroide (brilho intrínseco)."
example = 3.34

[columns.diameter]
type = "float"
description = "Diâmetro estimado ou medido do objeto em quilômetros (km)."
example = 939.4

[columns.albedo]
type = "float"
description = "Albedo geométrico (capacidade de reflexão da superfície)."
example = 0.09

[columns.diameter_sigma]
type = "float"
description = "Incerteza (desvio padrão) da medição do diâmetro em km."
example = 0.2

[columns.orbit_id]
type = "string"
description = "Identificador da solução de órbita utilizada."
example = "JPL 47"

[columns.epoch]
type = "float"
description = "Época da órbita expressa em dias Julianos (JD)."
example = 2458600.5

[columns.epoch_mjd]
type = "integer"
description = "Época da órbita expressa em Data Juliana Modificada (MJD)."
example = 58600

[columns.epoch_cal]
type = "string"
description = "Época da órbita convertida em data do calendário civil (AAAAMMDD)."
example = "20190427"

[columns.equinox]
type = "string"
description = "Equinócio de referência para o sistema de coordenadas orbitais."
example = "J2000"

[columns.e]
type = "float"
description = "Excentricidade orbital (o quão alongada é a órbita)."
example = 0.0755

[columns.a]
type = "float"
description = "Semieixo maior da órbita medido em Unidades Astronômicas (AU)."
example = 2.767

[columns.q]
type = "float"
description = "Distância do periélio (ponto mais próximo do Sol) em AU."
example = 2.558

[columns.i]
type = "float"
description = "Inclinação orbital em relação ao plano da eclíptica (graus)."
example = 10.59

[columns.om]
type = "float"
description = "Longitude do nó ascendente (graus)."
example = 80.32

[columns.w]
type = "float"
description = "Argumento do periélio (graus)."
example = 73.59

[columns.ma]
type = "float"
description = "Anomalia média no momento da época (graus)."
example = 77.37

[columns.ad]
type = "float"
description = "Distância do afélio (ponto mais distante do Sol) em AU."
example = 2.976

[columns.n]
type = "float"
description = "Movimento médio orbital expresso em graus por dia."
example = 0.2138

[columns.tp]
type = "float"
description = "Tempo de passagem pelo periélio expresso em Dia Juliano."
example = 2458239.1

[columns.tp_cal]
type = "string"
description = "Data de passagem pelo periélio no formato civil (AAAAMMDD.HHMMSS)."
example = "20180430.123"

[columns.per]
type = "float"
description = "Período orbital completo medido em dias."
example = 1681.5

[columns.per_y]
type = "float"
description = "Período orbital completo medido em anos terrestres."
example = 4.6

[columns.moid]
type = "float"
description = "Distância mínima de interseção orbital com a Terra (MOID) em AU."
example = 1.592

[columns.moid_ld]
type = "float"
description = "Distância mínima de interseção orbital em Distâncias Lunares (LD)."
example = 619.6

[columns.sigma_e]
type = "float"
description = "Incerteza do parâmetro de excentricidade (e)."
example = 1.1e-11

[columns.sigma_a]
type = "float"
description = "Incerteza do parâmetro de semieixo maior (a)."
example = 2.3e-11

[columns.sigma_q]
type = "float"
description = "Incerteza do parâmetro de distância do periélio (q)."
example = 3.1e-11

[columns.sigma_i]
type = "float"
description = "Incerteza do parâmetro de inclinação orbital (i)."
example = 6.4e-07

[columns.sigma_om]
type = "float"
description = "Incerteza do parâmetro de longitude do nó ascendente (om)."
example = 2.5e-06

[columns.sigma_w]
type = "float"
description = "Incerteza do parâmetro de argumento do periélio (w)."
example = 2.6e-06

[columns.sigma_ma]
type = "float"
description = "Incerteza do parâmetro de anomalia média (ma)."
example = 8.9e-07

[columns.sigma_ad]
type = "float"
description = "Incerteza do parâmetro de distância do afélio (ad)."
example = 2.5e-11

[columns.sigma_n]
type = "float"
description = "Incerteza do parâmetro de movimento médio (n)."
example = 2.7e-12

[columns.sigma_tp]
type = "float"
description = "Incerteza do parâmetro de tempo de passagem pelo periélio (tp)."
example = 4.1e-06

[columns.sigma_per]
type = "float"
description = "Incerteza do parâmetro de período orbital (per)."
example = 2.1e-08

[columns.class]
type = "string"
description = "Classificação da órbita do asteroide (ex: MBA, APO, AMO, Aten)."
example = "MBA"

[columns.rms]
type = "float"
description = "Ajuste residual quadrático médio da determinação orbital (precisão dos dados)."
example = 0.38
